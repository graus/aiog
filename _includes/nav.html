<nav>
    <div class="container">
        <ul>
            {% for item in site.data.navigation %}
            <li><a href="{% if item.external %}{{ item.url }}{% else %}{{ item.url | relative_url }}#content{% endif %}"{% if item.external %} target="_blank" rel="noopener"{% endif %} class="{% if page.url == item.url %}active{% endif %}{% if item.cta %} cta-btn{% endif %}">{{ item.title }}</a></li>
            {% endfor %}
        </ul>
    </div>
</nav>
