<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="478" height="136" viewBox="0 0 478 136">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&amp;display=swap');
      @font-face {
        font-family: 'OpenGov Sans';
        src: url('https://aiog.net/fonts/OpenGov-Sans-V1.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
      }
      .logo-ai-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 143px; fill: #ffffff; filter: url(#softShadow); }
      .logo-ampersand { font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 144px; fill: rgba(255, 255, 255, 0.85); filter: url(#softShadow); }
      .logo-og-text { font-family: 'OpenGov Sans', 'Montserrat', sans-serif; font-weight: 400; font-size: 128px; fill: #ffffff; filter: url(#softShadow); }
      .logo-bar { fill: rgba(255, 255, 255, 0.9); }
      .logo-subtitle { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 14px; fill: #0f172a; text-anchor: middle; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect class="logo-bar" x="0" y="114" width="478" height="22" rx="2"/>
  <text class="logo-subtitle" x="239" y="129">ARTIFICIAL INTELLIGENCE AND OPEN GOVERNMENT WORKSHOP</text>
  <text class="logo-ai-text" x="6" y="102">AI</text>
  <text class="logo-ampersand" x="171" y="102">&amp;</text>
  <text class="logo-og-text" x="268" y="102">OG</text>
</svg>
